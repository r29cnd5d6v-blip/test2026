   <meta charset="UTF-8">
    <title>Datum Beispiel</title>
    <script>
        function zeigeDatum() {
            var heute = new Date();
            var datumString = heute.toLocaleDateString('de-DE'); // Format: TT.MM.JJJJ
            document.getElementById('datum').innerHTML = datumString;
        }
    </script>
</head>

<body onload="zeigeDatum()">
    <header>
        <p>heute ist: <span id="datum"></span></p>
    </header>
